[tools]
python = "latest"
node = "latest"
lua = "5.1"
neovim = "latest"
rust = "latest"

"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@hypabolic/hypa" = "latest"

# Rolling prerelease tag; run `mise install --force github:wez/wiff` to pull a newer build.
"github:wez/wiff" = "continuous"

[settings]
idiomatic_version_file_enable_tools = ["python", "node"]
# Auto-load `.env` from the current directory and its parents, the way plain
# dotenv tooling does. Unlike `[env] _.file`, this needs no per-repo mise.toml
# and resolves against cwd rather than config_root.
env_file = ".env"
